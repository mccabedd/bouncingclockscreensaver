name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # --warnaserror enforces the README's "0 warnings, 0 errors" requirement
      # by failing CI the moment a warning is introduced, not just an error.
      - name: Build (Release)
        run: dotnet build -c Release --warnaserror
